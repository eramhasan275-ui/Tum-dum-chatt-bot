<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tum Dum • Owner Profile</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Montserrat", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;

      background:
        radial-gradient(circle at 20% 20%, rgba(108,92,231,.35), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(253,121,168,.25), transparent 30%),
        linear-gradient(135deg, #080614, #15102c, #0c0a19);

      color: white;
      overflow-x: hidden;
    }


    /* ================================
       FLOATING BACKGROUND
    ================================= */

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .35;
      pointer-events: none;
    }

    .orb.one {
      width: 180px;
      height: 180px;
      background: #6c5ce7;
      top: 5%;
      left: 5%;
      animation: float 7s ease-in-out infinite;
    }

    .orb.two {
      width: 160px;
      height: 160px;
      background: #fd79a8;
      bottom: 5%;
      right: 5%;
      animation: float 9s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-25px);
      }
    }


    /* ================================
       MAIN CARD
    ================================= */

    .container {
      position: relative;
      width: 100%;
      max-width: 470px;

      padding: 35px 25px;

      border-radius: 28px;

      background: rgba(255,255,255,.07);

      border: 1px solid rgba(255,255,255,.13);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.08);

      text-align: center;

      animation: cardIn .8s ease;
    }

    @keyframes cardIn {

      from {
        opacity: 0;
        transform: translateY(30px) scale(.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

    }


    /* ================================
       ONLINE BADGE
    ================================= */

    .online {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 7px 14px;

      margin-bottom: 22px;

      border-radius: 30px;

      background: rgba(46,213,115,.12);

      border: 1px solid rgba(46,213,115,.25);

      color: #7bed9f;

      font-size: 12px;
      font-weight: 600;
    }

    .online-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #2ed573;

      box-shadow: 0 0 12px #2ed573;

      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {

      0% {
        box-shadow: 0 0 0 0 rgba(46,213,115,.5);
      }

      70% {
        box-shadow: 0 0 0 8px rgba(46,213,115,0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(46,213,115,0);
      }

    }


    /* ================================
       PROFILE IMAGE
    ================================= */

    .photo-wrapper {
      position: relative;

      width: 135px;
      height: 135px;

      margin: auto;
    }

    .profile-photo {
      width: 135px;
      height: 135px;

      object-fit: cover;

      border-radius: 50%;

      border: 4px solid rgba(255,255,255,.8);

      box-shadow:
        0 0 0 6px rgba(108,92,231,.2),
        0 0 35px rgba(108,92,231,.65);
    }


    .verified {
      position: absolute;

      right: 3px;
      bottom: 5px;

      width: 31px;
      height: 31px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #6c5ce7;

      border: 3px solid #15102c;

      color: white;

      font-size: 13px;
    }


    /* ================================
       TITLE
    ================================= */

    h1 {
      margin-top: 20px;

      font-size: 30px;
      font-weight: 800;

      background:
        linear-gradient(
          90deg,
          #a29bfe,
          #ffffff,
          #fd79a8
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }


    .subtitle {
      margin-top: 7px;

      color: #c9c6d9;

      font-size: 13px;

      letter-spacing: 1.5px;
    }


    .bot-badge {
      display: inline-block;

      margin-top: 12px;

      padding: 7px 13px;

      border-radius: 20px;

      background: rgba(108,92,231,.16);

      border: 1px solid rgba(108,92,231,.35);

      color: #c9c3ff;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: .8px;
    }


    /* ================================
       INFO CARD
    ================================= */

    .info-card {

      margin-top: 28px;

      padding: 20px;

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          rgba(108,92,231,.17),
          rgba(255,255,255,.035)
        );

      border: 1px solid rgba(255,255,255,.08);

      text-align: left;
    }


    .info-row {

      display: flex;
      align-items: center;

      padding: 13px 0;

      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .info-row:last-child {
      border-bottom: none;
    }


    .icon {

      min-width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-right: 13px;

      border-radius: 11px;

      background: rgba(108,92,231,.18);

      color: #a29bfe;

      font-size: 15px;
    }


    .info-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }


    .label {
      color: #9290a5;

      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: 1px;
    }


    .value {
      color: #f5f3ff;

      font-size: 13px;

      font-weight: 600;
    }


    /* ================================
       SOCIAL BUTTONS
    ================================= */

    .contact-title {

      margin-top: 25px;
      margin-bottom: 13px;

      text-align: left;

      color: #aaa7bd;

      font-size: 11px;

      letter-spacing: 1.5px;

      text-transform: uppercase;
    }


    .contact-box {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 11px;
    }


    .contact-box a {

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      padding: 13px 10px;

      border-radius: 13px;

      text-decoration: none;

      color: white;

      font-size: 12px;

      font-weight: 600;

      background: rgba(255,255,255,.055);

      border: 1px solid rgba(255,255,255,.09);

      transition: .3s;
    }


    .contact-box a:hover {

      transform: translateY(-4px);

      background: rgba(108,92,231,.25);

      border-color: rgba(162,155,254,.5);

      box-shadow: 0 10px 25px rgba(108,92,231,.25);
    }


    .contact-box i {
      font-size: 15px;
    }


    /* ================================
       FOOTER
    ================================= */

    footer {

      margin-top: 28px;

      padding-top: 18px;

      border-top: 1px solid rgba(255,255,255,.07);

      color: #77758a;

      font-size: 10px;

      line-height: 1.7;
    }


    .footer-brand {
      color: #a29bfe;
      font-weight: 700;
    }


    /* ================================
       MOBILE
    ================================= */

    @media(max-width: 420px) {

      body {
        padding: 15px;
      }

      .container {
        padding: 28px 18px;
        border-radius: 23px;
      }

      h1 {
        font-size: 26px;
      }

      .contact-box {
        grid-template-columns: 1fr 1fr;
      }

    }

  </style>
</head>


<body>

  <!-- Background -->
  <div class="orb one"></div>
  <div class="orb two"></div>


  <div class="container">


    <!-- Online -->
    <div class="online">
      <span class="online-dot"></span>
      SYSTEM ONLINE
    </div>


    <!-- Profile -->
    <div class="photo-wrapper">

      <!-- নিজের ছবির URL এখানে দাও -->
      <img
        src="YOUR_PHOTO_URL_HERE"
        class="profile-photo"
        alt="Eram"
      >

      <div class="verified">
        <i class="fas fa-check"></i>
      </div>

    </div>


    <!-- Name -->
    <h1>ইরাম</h1>

    <p class="subtitle">
      OWNER • DEVELOPER • CREATOR
    </p>

    <div class="bot-badge">
      <i class="fas fa-robot"></i>
      TUM DUM
    </div>


    <!-- Information -->
    <div class="info-card">


      <div class="info-row">

        <div class="icon">
          <i class="fas fa-user"></i>
        </div>

        <div class="info-text">
          <span class="label">Name</span>
          <span class="value">ইরাম</span>
        </div>

      </div>


      <div class="info-row">

        <div class="icon">
          <i class="fas fa-robot"></i>
        </div>

        <div class="info-text">
          <span class="label">Bot</span>
          <span class="value">Tum Dum</span>
        </div>

      </div>


      <div class="info-row">

        <div class="icon">
          <i class="fas fa-code"></i>
        </div>

        <div class="info-text">
          <span class="label">Role</span>
          <span class="value">Chatbot Developer</span>
        </div>

      </div>


      <div class="info-row">

        <div class="icon">
          <i class="fas fa-graduation-cap"></i>
        </div>

        <div class="info-text">
          <span class="label">Education</span>
          <span class="value">Student</span>
        </div>

      </div>


      <div class="info-row">

        <div class="icon">
          <i class="fas fa-heart"></i>
        </div>

        <div class="info-text">
          <span class="label">Status</span>
          <span class="value">Building & Creating</span>
        </div>

      </div>


    </div>


    <!-- Social -->
    <div class="contact-title">
      Connect With Me
    </div>


    <div class="contact-box">

      <!-- নিজের link বসাও -->
      <a href="YOUR_FACEBOOK_LINK" target="_blank">
        <i class="fab fa-facebook-f"></i>
        Facebook
      </a>


      <a href="YOUR_MESSENGER_LINK" target="_blank">
        <i class="fab fa-facebook-messenger"></i>
        Messenger
      </a>


      <a href="YOUR_GITHUB_LINK" target="_blank">
        <i class="fab fa-github"></i>
        GitHub
      </a>


      <a href="YOUR_WHATSAPP_LINK" target="_blank">
        <i class="fab fa-whatsapp"></i>
        WhatsApp
      </a>

    </div>


    <!-- Footer -->
    <footer>

      <span class="footer-brand">
        Tum Dum
      </span>

      • Developed & Managed by

      <span class="footer-brand">
        ইরাম
      </span>

      <br>

      © <script>
        document.write(new Date().getFullYear());
      </script>

      All Rights Reserved.

    </footer>


  </div>

</body>
</html>
